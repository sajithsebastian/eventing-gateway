apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventing-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
      - name: control-plane
        image: my-repo/eventing-control-plane:latest
        ports:
        - containerPort: 8080
        env:
        - name: AWS_REGION
          value: us-east-1
        - name: DYNAMODB_TABLE
          value: EventingGatewayTopicMappings
---
apiVersion: v1
kind: Service
metadata:
  name: eventing-control-plane
spec:
  selector:
    app: control-plane
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
