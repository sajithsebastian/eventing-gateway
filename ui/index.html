<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventing Gateway Control Plane</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { padding: 8px; width: 200px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>Eventing Gateway Control Plane</h1>

    <div id="onboarding">
        <h2>Onboard New Topic</h2>
        <div class="form-group">
            <label for="topicName">Topic Name</label>
            <input type="text" id="topicName" placeholder="my-topic">
        </div>
        <div class="form-group">
            <label for="primaryCluster">Primary Cluster</label>
            <select id="primaryCluster">
                <option value="cluster-a">Cluster A</option>
                <option value="cluster-b">Cluster B</option>
            </select>
        </div>
        <button onclick="onboardTopic()">Onboard Topic</button>
    </div>

    <hr>

    <div id="topicList">
        <h2>Topic Mappings</h2>
        <button onclick="loadTopics()">Refresh List</button>
        <table id="topicsTable">
            <thead>
                <tr>
                    <th>Topic Name</th>
                    <th>Primary Cluster</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Topics will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = '/api/topics';

        async function loadTopics() {
            try {
                const response = await fetch(API_BASE);
                const topics = await response.json();
                const tbody = document.querySelector('#topicsTable tbody');
                tbody.innerHTML = '';

                Object.values(topics).forEach(topic => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${topic.topicName}</td>
                        <td>${topic.primaryCluster}</td>
                        <td>${topic.status}</td>
                        <td>
                            <button onclick="migrateTopic('${topic.topicName}', '${topic.primaryCluster === 'cluster-a' ? 'cluster-b' : 'cluster-a'}')">
                                Switch to ${topic.primaryCluster === 'cluster-a' ? 'Cluster B' : 'Cluster A'}
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("Failed to load topics", e);
            }
        }

        async function onboardTopic() {
            const topicName = document.getElementById('topicName').value;
            const primaryCluster = document.getElementById('primaryCluster').value;

            await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topicName, primaryCluster })
            });
            loadTopics();
        }

        async function migrateTopic(topicName, targetCluster) {
            await fetch(`${API_BASE}/${topicName}/migrate?targetCluster=${targetCluster}`, {
                method: 'PUT'
            });
            loadTopics();
        }

        // Initial load
        // loadTopics();
    </script>
</body>
</html>
